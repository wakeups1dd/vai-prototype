<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-styles.css">
    <link rel="stylesheet" href="mobile-responsive.css">
    <link rel="stylesheet" href="edtech-modern-theme.css">
    <link rel="stylesheet" href="universal-responsive.css?v=3.0">
</head>
<body>
    <script>
        // Check admin access
        const session = JSON.parse(localStorage.getItem('vai_session') || 'null');
        if (!session || (session.role !== 'admin' && session.role !== 'teacher')) {
            window.location.href = 'login.html';
        }
    </script>

    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <h2>VAI<span>-ai</span></h2>
                <p>Admin Panel</p>
            </div>
            
            <nav class="admin-nav">
                <button class="nav-btn active" onclick="showAdminSection('dashboard')">
                    📊 Dashboard
                </button>
                <button class="nav-btn" onclick="showAdminSection('students')">
                    👥 Students
                </button>
                <button class="nav-btn" onclick="showAdminSection('classes')">
                    🎓 Classes
                </button>
                <button class="nav-btn" onclick="showAdminSection('activity')">
                    📈 Activity Logs
                </button>
                <button class="nav-btn" onclick="showAdminSection('users')">
                    👤 All Users
                </button>
            </nav>
            
            <div class="admin-profile">
                <div class="profile-avatar">A</div>
                <div class="profile-info">
                    <div class="profile-name" id="adminName">Admin</div>
                    <div class="profile-role">Administrator</div>
                </div>
            </div>
            
            <button class="logout-btn" onclick="adminLogout()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Exit
            </button>
        </aside>
        <div class="mobile-sidebar-backdrop" id="adminSidebarBackdrop"></div>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="vai-mobile-nav-toggle" id="adminSidebarToggle" aria-label="Toggle Admin Menu" style="background: #1e3a8a; border-color: #3b82f6;">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <h1 id="pageTitle">Dashboard</h1>
                </div>
                <div class="header-actions">
                    <button class="header-btn" onclick="refreshData()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12a9 9 0 009-9 9.75 9.75 0 016.74 2.74L21 8"></path>
                            <path d="M21 3v5h-5"></path>
                            <path d="M21 12a9 9 0 01-9 9 9.75 9.75 0 01-6.74-2.74L3 16"></path>
                            <path d="M3 21v-5h5"></path>
                        </svg>
                        Refresh
                    </button>
                    <div class="current-time" id="currentTime"></div>
                </div>
            </header>

            <!-- Dashboard Section -->
            <section id="dashboardSection" class="admin-section active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">👥</div>
                        <div class="stat-content">
                            <div class="stat-value" id="totalStudents">0</div>
                            <div class="stat-label">Total Students</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">✅</div>
                        <div class="stat-content">
                            <div class="stat-value" id="activeToday">0</div>
                            <div class="stat-label">Active Today</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🎓</div>
                        <div class="stat-content">
                            <div class="stat-value" id="totalClasses">6</div>
                            <div class="stat-label">Classes (5-10th)</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📈</div>
                        <div class="stat-content">
                            <div class="stat-value" id="totalLogins">0</div>
                            <div class="stat-label">Total Logins</div>
                        </div>
                    </div>
                </div>

                <div class="class-breakdown">
                    <h2>Students by Class</h2>
                    <div id="classBreakdown" class="class-chart"></div>
                </div>

                <div class="recent-activity">
                    <h2>Recent Activity</h2>
                    <div id="recentActivity" class="activity-list"></div>
                </div>
            </section>

            <!-- Students Section -->
            <section id="studentsSection" class="admin-section">
                <div class="section-header">
                    <input type="text" id="studentSearch" placeholder="Search students..." class="search-input">
                    <select id="classFilter" class="filter-select" onchange="filterStudents()">
                        <option value="">All Classes</option>
                        <option value="5">5th</option>
                        <option value="6">6th</option>
                        <option value="7">7th</option>
                        <option value="8">8th</option>
                        <option value="9">9th</option>
                        <option value="10">10th</option>
                    </select>
                </div>
                <div id="studentsTable" class="data-table"></div>
            </section>

            <!-- Classes Section -->
            <section id="classesSection" class="admin-section">
                <div id="classesGrid" class="classes-grid"></div>
            </section>

            <!-- Activity Section -->
            <section id="activitySection" class="admin-section">
                <div id="activityTable" class="data-table"></div>
            </section>

            <!-- Users Section -->
            <section id="usersSection" class="admin-section">
                <div id="usersTable" class="data-table"></div>
            </section>
        </main>
    </div>

    <script src="admin-script.js"></script>
    <script>
        // Admin mobile navigation drawer toggle
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('adminSidebarToggle');
            const sidebar = document.querySelector('.admin-sidebar');
            const backdrop = document.getElementById('adminSidebarBackdrop');

            function openAdminNav() {
                if (sidebar) sidebar.classList.add('mobile-open');
                if (backdrop) backdrop.classList.add('active');
            }
            function closeAdminNav() {
                if (sidebar) sidebar.classList.remove('mobile-open');
                if (backdrop) backdrop.classList.remove('active');
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (sidebar && sidebar.classList.contains('mobile-open')) {
                        closeAdminNav();
                    } else {
                        openAdminNav();
                    }
                });
            }

            if (backdrop) {
                backdrop.addEventListener('click', closeAdminNav);
            }

            document.querySelectorAll('.admin-nav .nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (window.innerWidth <= 768) {
                        closeAdminNav();
                    }
                });
            });
        });
    </script>
</body>
</html>
